<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser Agent</title>
  <style>
    :root {
      --bg: #0a0a0b;
      --surface: #111113;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.18);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #f4f4f5;
      --accent-text: #09090b;
      --ok: #10b981;
      --warn: #f59e0b;
      --err: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 12.5px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .version {
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--text-muted);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 11px 12px;
      margin-bottom: 12px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 500;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
    }
    .dot.connected { background: var(--ok); }
    .dot.disconnected { background: var(--warn); }

    .tab-title {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .btn-primary {
      width: 100%;
      padding: 9px 14px;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      transition: background 0.15s;
    }
    .btn-primary:hover {
      background: #ffffff;
    }

    .field-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-row {
      display: flex;
      gap: 6px;
    }

    .input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 9px;
      border-radius: 7px;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      outline: none;
    }
    .input:focus {
      border-color: var(--border-strong);
    }

    .btn-secondary {
      padding: 6px 11px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      padding: 0;
    }
    .link-btn:hover {
      color: var(--text);
      text-decoration: underline;
    }

    .feedback-msg {
      margin-top: 6px;
      font-size: 11px;
      color: var(--ok);
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-title">Browser Agent</div>
    <span class="version">Firefox Bridge</span>
  </div>

  <div class="card">
    <div class="status-row">
      <div class="status-left">
        <div id="statusDot" class="dot disconnected"></div>
        <span id="statusText">Checking...</span>
      </div>
      <button id="pingBtn" type="button" class="link-btn">Ping</button>
    </div>
    <div id="activeTabInfo" class="tab-title">Detecting active tab...</div>
  </div>

  <button id="btnOpenSidebar" type="button" class="btn-primary">
    Open Agent Sidebar
  </button>

  <div class="card">
    <div class="field-label">Server URL</div>
    <div class="input-row">
      <input type="text" id="serverUrl" class="input" placeholder="https://..." spellcheck="false" />
      <button id="saveBtn" type="button" class="btn-secondary">Save</button>
    </div>
    <div id="feedbackMsg" class="feedback-msg">Saved and reconnected</div>
  </div>

  <div class="footer">
    <button id="btnOpenWeb" type="button" class="link-btn">Open Dashboard</button>
    <button id="btnReloadExt" type="button" class="link-btn">Reload Extension</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
