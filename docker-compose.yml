services:
  browser-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: browser-agent
    init: true
    shm_size: "1gb"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
    restart: unless-stopped
